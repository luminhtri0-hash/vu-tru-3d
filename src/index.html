  <div id="chon-bai" class="vien-thuoc">

    <button id="ten-bai" title="Mở mục lục" data-dich-title="gd.mo-muc-luc"></button>

  </div>
  <div class="gian"></div>
  <div id="nut-phai" class="vien-thuoc">
    <button id="nut-xem-video" title="Xem như video: giọng đọc, phụ đề, tự sang bước (phím V)" aria-label="Xem như video" data-dich-title="xv.nut-tren" data-dich-aria-label="xv.xem-nhu-video-ngan"></button>
    <button id="nut-tam-dung" title="Tạm dừng / chạy tiếp (phím cách)" data-dich-title="gd.tam-dung-chay-tiep-phim-cach">❚❚</button>

    <button id="nut-toan-man" title="Toàn màn hình (phím F)" data-dich-title="gd.toan-man-hinh-phim-f">⛶</button>
    <button id="nut-tieng" title="Âm thanh và chất lượng hình: bật, tắt tiếng, mức âm, nhạc nền, hình nhẹ hay nét (phím S để bật, tắt tiếng nhanh)" aria-label="Âm thanh và hình" data-dich-title="gd.am-thanh-va-chat-luong-hinh-bat-tat-tieng-muc-am-nha" data-dich-aria-label="gd.am-thanh-va-hinh"></button>
    <button id="nut-thuat-ngu" title="Sổ tay: thuật ngữ Việt – Anh và công thức của cả khoá (phím G)" data-dich-title="gd.so-tay-thuat-ngu-viet-anh-va-cong-thuc-cua-ca-khoa-p">Aa</button>
    <button id="nut-bang" title="Ẩn / hiện bài giảng (phím B)" data-dich-title="gd.an-hien-bai-giang-phim-b">☰</button>
